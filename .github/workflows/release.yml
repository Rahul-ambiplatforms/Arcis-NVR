name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Leave blank to use version in build.gradle.kts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/arcisai-release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Extract version from build.gradle.kts
        id: ver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME"  >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE"  >> $GITHUB_OUTPUT

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "ref=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "ref=v${{ steps.ver.outputs.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK with version
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "app/build/outputs/apk/release/ArcisAI-NVR-${{ steps.tag.outputs.ref }}.apk"

      - name: Extract release notes from tag annotation
        id: notes
        run: |
          BODY=$(git tag -l --format='%(contents)' "${{ steps.tag.outputs.ref }}" | tail -n +3)
          if [ -z "$BODY" ]; then
            BODY="No release notes provided."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY"     >> $GITHUB_OUTPUT
          echo "EOF"       >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          name: "ArcisAI NVR ${{ steps.tag.outputs.ref }}"
          body: |
            ## What's changed
            ${{ steps.notes.outputs.body }}

            ---
            | Field        | Value |
            |-------------|-------|
            | Version Name | `${{ steps.ver.outputs.name }}` |
            | Version Code | `${{ steps.ver.outputs.code }}` |

            **Installation:** download and install `ArcisAI-NVR-${{ steps.tag.outputs.ref }}.apk`
          files: app/build/outputs/apk/release/ArcisAI-NVR-${{ steps.tag.outputs.ref }}.apk
          draft: false
          prerelease: false
